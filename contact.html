<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact | Reflections</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet">
  <link href="assets/css/style.css" rel="stylesheet">
</head>
<body data-page="contact" data-preloader="mini">
  <div id="global-preloader" class="preloader">
    <div class="preloader-logo">REFLECTIONS</div>
    <div class="preloader-counter" id="preloader-counter">0%</div>
  </div>

  <div id="site-header"></div>
  <main>
    <section class="sub-hero" data-random-breadcrumb="contact">
      <div class="container">
        <p class="text-accent mb-2">Home / Contact</p>
        <h1>Let's Build Something Bold</h1>
      </div>
    </section>
    <section class="section-space">
      <div class="container">
        <div class="row g-5">
          <div class="col-lg-5">
            <h3>Contact Info</h3>
            <p>Email: hello@reflections.agency</p>
            <p>Phone: +1 555 123 4578</p>
            <p>Address: 121 Creative Ave, New York, NY</p>
          </div>
          <div class="col-lg-7">
            <form class="contact-form">
              <div class="mb-3"><input class="form-control" type="text" placeholder="Name"></div>
              <div class="mb-3"><input class="form-control" type="email" placeholder="Email"></div>
              <div class="mb-3"><input class="form-control" type="text" placeholder="Subject"></div>
              <div class="mb-3"><textarea class="form-control" rows="5" placeholder="Message"></textarea></div>
              <button type="submit" class="btn btn-accent">Send Message</button>
            </form>
          </div>
        </div>
      </div>
    </section>
  </main>
  <div id="site-footer"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://unpkg.com/lenis@1.1.5/dist/lenis.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
  <script src="assets/js/main.js"></script>
</body>
</html>
